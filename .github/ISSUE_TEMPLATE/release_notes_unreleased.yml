name: Release notes (unreleased)
description: Track upcoming user-facing changes before a release branch exists
title: "Release Notes: Unreleased"
body:
  - type: markdown
    attributes:
      value: |
        Use this issue as the rolling draft for upcoming user-facing changes.
        Reuse this single issue instead of creating duplicates. Multiple open duplicates make release workflows fail.
        Keep upcoming user-facing bullets here while changes are still landing on `main`.
        When `prepare-release-branch` creates `release/X.Y`, manually move the shipped bullets into `Release Notes: X.Y` and leave future items here.
        Keep this issue open continuously.
  - type: textarea
    id: release_notes
    attributes:
      label: Release Notes
      description: Keep short user-facing bullets here while work is still targeting `main`.
      placeholder: |
        - Add a clearer save confirmation for copied images
        - Fix startup handling when the clipboard contains unsupported content
    validations:
      required: true
