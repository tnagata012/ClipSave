name: PR Check

on:
  pull_request:
    branches: [main, 'release/*']

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: pr-check-${{ github.head_ref }}
  cancel-in-progress: true

env:
  SOLUTION_FILE: ClipSave.slnx
  APP_PROJECT: src/ClipSave/ClipSave.csproj

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Lint GitHub Actions workflows
      uses: raven-actions/actionlint@205b530c5d9fa8f44ae9ed59f341a0db994aa6f8 # v2.1.2

    - name: Resolve PR metadata
      id: pr
      uses: actions/github-script@v7
      with:
        script: |
          const pr = context.payload.pull_request;
          if (!pr?.number || !pr.base?.ref || !pr.head?.sha) {
            core.setFailed("pull_request payload is missing required PR metadata.");
            return;
          }

          core.info(`Resolved PR #${pr.number} from pull_request event targeting '${pr.base.ref}'.`);
          core.setOutput("pr_number", String(pr.number));
          core.setOutput("base_ref", pr.base.ref);
          core.setOutput("head_sha", pr.head.sha);

    - name: Initialize check status
      uses: actions/github-script@v7
      with:
        script: |
          const targetUrl = `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
          await github.rest.repos.createCommitStatus({
            owner: context.repo.owner,
            repo: context.repo.repo,
            sha: "${{ steps.pr.outputs.head_sha }}",
            state: "pending",
            context: "check",
            description: "PR Check is running.",
            target_url: targetUrl,
          });

    - name: Detect website-only changes
      id: changes
      uses: actions/github-script@v7
      with:
        script: |
          const websiteOnlyPatterns = [
            /^site\//,
            /^\.github\/workflows\/deploy-pages\.yml$/,
            /^docs\/presentation\/LandingPage\.md$/,
          ];

          const files = await github.paginate(github.rest.pulls.listFiles, {
            owner: context.repo.owner,
            repo: context.repo.repo,
            pull_number: Number("${{ steps.pr.outputs.pr_number }}"),
            per_page: 100,
          });

          const changedFiles = files.flatMap((file) => {
            const paths = [file.filename];
            if (file.status === "renamed" && file.previous_filename) {
              paths.push(file.previous_filename);
            }
            return paths;
          });
          const changedFileLog = files.map((file) =>
            file.status === "renamed" && file.previous_filename
              ? `${file.previous_filename} -> ${file.filename}`
              : file.filename
          );
          const websiteOnly =
            changedFiles.length > 0 &&
            changedFiles.every((filename) =>
              websiteOnlyPatterns.some((pattern) => pattern.test(filename))
            );

          core.info(`Changed files:\n${changedFileLog.join("\n")}`);
          core.setOutput("website_only", String(websiteOnly));

    - name: Website-only PR shortcut
      if: steps.changes.outputs.website_only == 'true'
      shell: pwsh
      run: |
        Write-Host "Website-only PR detected. Skipping restore/build/test pipeline."

    - name: Setup .NET
      if: steps.changes.outputs.website_only != 'true'
      uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json

    - name: Cache NuGet packages
      if: steps.changes.outputs.website_only != 'true'
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.slnx') }}
        restore-keys: ${{ runner.os }}-nuget-

    - name: Restore
      if: steps.changes.outputs.website_only != 'true'
      run: dotnet restore ${{ env.SOLUTION_FILE }}

    - name: Security checks
      if: steps.changes.outputs.website_only != 'true'
      shell: pwsh
      run: ./scripts/run-security-checks.ps1 -Configuration Debug -NoRestore

    - name: Build app
      if: steps.changes.outputs.website_only != 'true'
      run: dotnet build ${{ env.APP_PROJECT }} --configuration Debug --no-restore

    - name: Localization resource guard
      if: steps.changes.outputs.website_only != 'true'
      run: dotnet test tests/ClipSave.UnitTests/ClipSave.UnitTests.csproj --configuration Debug --filter "FullyQualifiedName~LocalizationResourceCompletenessTests"

    - name: Test
      if: steps.changes.outputs.website_only != 'true'
      shell: pwsh
      run: ./scripts/run-tests.ps1 -Configuration Debug -Verbosity normal -EmitTrx -ResultsDirectory "${{ github.workspace }}/TestResults"

    - name: Upload test results
      if: always() && steps.changes.outputs.website_only != 'true'
      uses: actions/upload-artifact@v4
      with:
        name: pr-test-results
        path: TestResults/**/*.trx
        if-no-files-found: warn
        retention-days: 14

    - name: SPEC traceability guard
      if: steps.changes.outputs.website_only != 'true'
      shell: pwsh
      run: ./scripts/check-spec-coverage.ps1

    - name: Validate version
      shell: pwsh
      run: ./scripts/assert-version-policy.ps1 -BranchName "${{ steps.pr.outputs.base_ref }}"

    - name: Finalize check status
      if: always() && steps.pr.outputs.head_sha != ''
      uses: actions/github-script@v7
      env:
        JOB_STATUS: ${{ job.status }}
      with:
        script: |
          const stateMap = {
            success: "success",
            failure: "failure",
            cancelled: "error",
          };
          const descriptionMap = {
            success: "PR Check succeeded.",
            failure: "PR Check failed.",
            cancelled: "PR Check was cancelled.",
          };
          const jobStatus = process.env.JOB_STATUS ?? "failure";
          const targetUrl = `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

          await github.rest.repos.createCommitStatus({
            owner: context.repo.owner,
            repo: context.repo.repo,
            sha: "${{ steps.pr.outputs.head_sha }}",
            state: stateMap[jobStatus] ?? "failure",
            context: "check",
            description: descriptionMap[jobStatus] ?? `PR Check ended with status '${jobStatus}'.`,
            target_url: targetUrl,
          });
