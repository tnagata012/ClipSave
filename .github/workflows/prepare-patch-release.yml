name: Prepare Patch Release

on:
  workflow_dispatch:
    inputs:
      release_branch:
        description: 'Target release branch (e.g., release/1.3)'
        required: true
        type: string
      create_patch_pr:
        description: 'Create PR for patch init branch'
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: prepare-patch-release-${{ inputs.release_branch }}
  cancel-in-progress: false

env:
  GIT_AUTHOR_NAME: ${{ github.actor }}
  GIT_AUTHOR_EMAIL: ${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com

jobs:
  prepare:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
    - name: Validate input
      shell: pwsh
      run: |
        $branch = "${{ inputs.release_branch }}"
        if ($branch -notmatch '^release/\d+\.\d+$') {
          throw "Invalid release branch format: $branch (expected release/X.Y)"
        }

    - name: Verify target release branch exists
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        $branch = "${{ inputs.release_branch }}"
        $encodedBranch = [Uri]::EscapeDataString($branch)
        gh api "repos/${{ github.repository }}/branches/$encodedBranch" *> $null
        if ($LASTEXITCODE -ne 0) {
          throw "Target release branch does not exist: $branch"
        }

    - name: Checkout release branch
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.release_branch }}
        fetch-depth: 0
        path: repo

    - name: Checkout workflow tooling
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.repository.default_branch }}
        path: tooling
        fetch-depth: 1
        sparse-checkout: |
          scripts
        sparse-checkout-cone-mode: true

    - name: Verify current release version has finalized archive
      id: current
      shell: pwsh
      working-directory: repo
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        $branch = "${{ inputs.release_branch }}"
        $branchMatch = [regex]::Match($branch, '^release/(?<major>\d+)\.(?<minor>\d+)$')
        if (-not $branchMatch.Success) {
          throw "Invalid release branch format: $branch (expected release/X.Y)"
        }

        [xml]$props = Get-Content Directory.Build.props
        $version = $props.Project.PropertyGroup.Version
        $versionMatch = [regex]::Match($version, '^(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+)$')
        if (-not $versionMatch.Success) {
          throw "Invalid version format on $branch: $version"
        }

        if (
          $versionMatch.Groups['major'].Value -ne $branchMatch.Groups['major'].Value -or
          $versionMatch.Groups['minor'].Value -ne $branchMatch.Groups['minor'].Value
        ) {
          throw "Release branch and version mismatch. Branch=$branch, Version=$version"
        }

        $tagCommit = (git rev-list -n 1 "refs/tags/$version").Trim()
        if (-not $tagCommit -or $tagCommit.Length -ne 40) {
          throw "Current version '$version' is not finalized yet. Create and push tag '$version' before starting the next patch cycle."
        }

        $headCommit = (git rev-parse HEAD).Trim()
        if (-not $headCommit -or $headCommit.Length -ne 40) {
          throw "Failed to resolve HEAD commit for $branch"
        }
        if ($headCommit -ne $tagCommit) {
          $releaseSupport = Join-Path $env:GITHUB_WORKSPACE "tooling/scripts/release-support.ps1"
          . $releaseSupport
          $blockingFiles = Get-BlockingFilesAheadOfFinalizedTag -TagCommit $tagCommit -HeadCommit $headCommit

          if ($blockingFiles.Count -gt 0) {
            $blockingList = $blockingFiles -join ", "
            throw "Release branch HEAD ($headCommit) is ahead of finalized tag '$version' ($tagCommit) with product-affecting changes: $blockingList. Start the next patch cycle only from the finalized commit or after removing those changes."
          }

          Write-Warning "Release branch HEAD is ahead of finalized tag '$version' only by non-product files. Continuing from HEAD."
        }

        $encodedRef = [Uri]::EscapeDataString("tags/$version")
        gh api "repos/${{ github.repository }}/git/ref/$encodedRef" *> $null
        if ($LASTEXITCODE -ne 0) {
          throw "Current version tag '$version' is not available on GitHub. Push the tag before starting the next patch cycle."
        }

        $assertScript = Join-Path $env:GITHUB_WORKSPACE "tooling/scripts/assert-finalized-release-archive.ps1"
        & $assertScript `
          -Repository "${{ github.repository }}" `
          -Version $version
        if ($LASTEXITCODE -ne 0) {
          throw "Release Finalize archive verification failed for '$version'."
        }

        echo "CURRENT_VERSION=$version" >> $env:GITHUB_OUTPUT
        echo "CURRENT_VERSION_SHA=$tagCommit" >> $env:GITHUB_OUTPUT
        Write-Host "Current finalized version: $version ($tagCommit)"

    - name: Resolve patch init target
      id: patch_target
      shell: pwsh
      run: |
        $currentVersion = "${{ steps.current.outputs.CURRENT_VERSION }}".Trim()
        if ($currentVersion -notmatch '^(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+)$') {
          throw "Invalid current version format: $currentVersion"
        }

        $major = [int]$matches['major']
        $minor = [int]$matches['minor']
        $patch = [int]$matches['patch']
        if ($patch -ge 65535) {
          throw "Cannot increment patch. Current patch is $patch (max supported 65535)."
        }

        $nextVersion = "$major.$minor.$($patch + 1)"
        $patchBranch = "chore/release-$nextVersion-init"

        echo "PATCH_VERSION=$nextVersion" >> $env:GITHUB_OUTPUT
        echo "PATCH_BRANCH=$patchBranch" >> $env:GITHUB_OUTPUT
        Write-Host "Patch branch: $patchBranch"
        Write-Host "Patch version: $nextVersion"

    - name: Configure git author
      shell: pwsh
      working-directory: repo
      run: |
        git config user.name "${{ env.GIT_AUTHOR_NAME }}"
        git config user.email "${{ env.GIT_AUTHOR_EMAIL }}"

    - name: Inspect existing patch init branch
      id: patch_state
      shell: pwsh
      working-directory: repo
      run: |
        function Get-VersionFromGitObject([string]$ObjectRef) {
          $content = git show $ObjectRef 2>$null
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace(($content -join "`n"))) {
            throw "Failed to read '$ObjectRef'."
          }

          $text = ($content -join "`n")
          $match = [regex]::Match($text, '<Version>(?<value>[^<]+)</Version>')
          if (-not $match.Success) {
            throw "Version element was not found in '$ObjectRef'."
          }

          return $match.Groups['value'].Value.Trim()
        }

        $patchBranch = "${{ steps.patch_target.outputs.PATCH_BRANCH }}"
        $expectedVersion = "${{ steps.patch_target.outputs.PATCH_VERSION }}"

        git ls-remote --exit-code --heads origin $patchBranch *> $null
        $patchExists = ($LASTEXITCODE -eq 0)
        if ($patchExists) {
          git fetch --no-tags origin "$patchBranch"
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to fetch origin/$patchBranch."
          }

          $actualVersion = Get-VersionFromGitObject ("origin/$patchBranch" + ":Directory.Build.props")
          if ($actualVersion -ne $expectedVersion) {
            throw "origin/$patchBranch has version '$actualVersion' but expected '$expectedVersion'."
          }

          $branchMode = "reuse_existing"
        } else {
          $branchMode = "create_new"
        }

        echo "BRANCH_MODE=$branchMode" >> $env:GITHUB_OUTPUT
        echo "PATCH_EXISTS=$($patchExists.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
        Write-Host "Branch mode: $branchMode"
        Write-Host "Patch branch exists: $patchExists"

    - name: Create patch init branch
      if: ${{ steps.patch_state.outputs.BRANCH_MODE == 'create_new' }}
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        $projectRoot = Join-Path $env:GITHUB_WORKSPACE "repo"
        $scriptPath = Join-Path $env:GITHUB_WORKSPACE "tooling/scripts/create-patch-release-branch.ps1"

        & $scriptPath `
          -ProjectRoot $projectRoot `
          -ReleaseBranch "${{ inputs.release_branch }}" `
          -Push

    - name: Create PR for patch init branch
      if: ${{ inputs.create_patch_pr }}
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        $head = "${{ steps.patch_target.outputs.PATCH_BRANCH }}"
        $base = "${{ inputs.release_branch }}"
        $version = "${{ steps.patch_target.outputs.PATCH_VERSION }}"
        $repo = "${{ github.repository }}"
        $releaseLine = $base -replace '^release/', ''

        $existingPrJson = gh pr list `
          --repo $repo `
          --head $head `
          --base $base `
          --state open `
          --json number,url 2>$null
        if ($LASTEXITCODE -ne 0) {
          throw "Failed to query existing pull requests."
        }

        try {
          $existingPrs = $existingPrJson | ConvertFrom-Json
        } catch {
          throw "Failed to parse pull request query result."
        }

        if ($null -eq $existingPrs) {
          $existingPrs = @()
        } elseif ($existingPrs -isnot [System.Array]) {
          $existingPrs = @($existingPrs)
        }

        $existingPr = $existingPrs | Select-Object -First 1
        if ($existingPr) {
          Write-Host "PR already exists: #$($existingPr.number) ($head -> $base)"
          if ($existingPr.url) {
            Write-Host "PR URL: $($existingPr.url)"
          }
          exit 0
        }

        $title = "chore: start $version patch release"
        $body = @"
        Automated PR created by **Prepare Patch Release** workflow.

        - Release branch: $base
        - Current finalized version: ${{ steps.current.outputs.CURRENT_VERSION }}
        - Patch init branch: $head
        - Version: $version
        - Release notes: update issue `Release Notes: $releaseLine` before tagging

        This PR is the only patch version bump for this release cycle.
        "@

        gh pr create --repo $repo --base $base --head $head --title $title --body $body
        if ($LASTEXITCODE -ne 0) {
          throw "Failed to create pull request: $head -> $base"
        }

    - name: Summary
      shell: pwsh
      run: |
        @"
        ## Patch Release Preparation Complete

        | Item | Value |
        |------|-------|
        | Release Branch | `${{ inputs.release_branch }}` |
        | Current Finalized Version | `${{ steps.current.outputs.CURRENT_VERSION }}` |
        | Patch Branch | `${{ steps.patch_target.outputs.PATCH_BRANCH }}` |
        | Patch Version | `${{ steps.patch_target.outputs.PATCH_VERSION }}` |
        | Branch Prep Mode | `${{ steps.patch_state.outputs.BRANCH_MODE }}` |
        | PR Created | `${{ inputs.create_patch_pr }}` |
        "@ >> $env:GITHUB_STEP_SUMMARY
