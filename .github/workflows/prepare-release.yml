name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release series (X.Y)'
        required: true
        type: string
      auto_create_release_line_issue:
        description: 'Auto-create/reopen release-line notes issue'
        required: true
        default: true
        type: boolean

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  group: prepare-release
  cancel-in-progress: false

env:
  GIT_AUTHOR_NAME: ${{ github.actor }}
  GIT_AUTHOR_EMAIL: ${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com

jobs:
  prepare:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
    - name: Checkout main
      uses: actions/checkout@v4
      with:
        ref: main
        fetch-depth: 0

    - name: Configure git author
      shell: pwsh
      run: |
        git config user.name "${{ env.GIT_AUTHOR_NAME }}"
        git config user.email "${{ env.GIT_AUTHOR_EMAIL }}"

    - name: Resolve release series
      id: version
      shell: pwsh
      run: |
        . ./scripts/release-series-policy.ps1

        [xml]$mainProps = Get-Content "Directory.Build.props"
        $mainVersion = $mainProps.Project.PropertyGroup.Version
        $resolution = Resolve-PrepareReleaseSeries `
          -MainVersion $mainVersion `
          -RequestedSeries "${{ inputs.version }}"

        echo "RELEASE_VERSION=$($resolution.ResolvedReleaseVersion)" >> $env:GITHUB_OUTPUT
        echo "RELEASE_SERIES=$($resolution.ResolvedReleaseSeries)" >> $env:GITHUB_OUTPUT
        echo "CURRENT_MAIN_VERSION=$($resolution.CurrentMainVersion)" >> $env:GITHUB_OUTPUT
        Write-Host "Current main version: $($resolution.CurrentMainVersion)"
        Write-Host "Resolved release series: $($resolution.ResolvedReleaseSeries)"
        Write-Host "Resolved release version: $($resolution.ResolvedReleaseVersion)"

    - name: Resolve branch target
      id: target
      shell: pwsh
      run: |
        $releaseSeries = "${{ steps.version.outputs.RELEASE_SERIES }}".Trim()
        $releaseVersion = "${{ steps.version.outputs.RELEASE_VERSION }}".Trim()
        if ($releaseSeries -notmatch '^(?<major>\d+)\.(?<minor>\d+)$') {
          throw "Invalid release series format: $releaseSeries"
        }
        if ($releaseVersion -notmatch '^\d+\.\d+\.\d+$') {
          throw "Invalid resolved version format: $releaseVersion"
        }

        $releaseBranch = "release/$releaseSeries"
        echo "RELEASE_BRANCH=$releaseBranch" >> $env:GITHUB_OUTPUT
        Write-Host "Release branch: $releaseBranch"

    - name: Validate main fixed version
      shell: pwsh
      run: |
        ./scripts/assert-version-policy.ps1 -BranchName "main"
        if ($LASTEXITCODE -ne 0) {
          throw "Version validation failed on main."
        }

        [xml]$props = Get-Content Directory.Build.props
        $version = [string]$props.Project.PropertyGroup.Version
        if ($version.Trim() -ne "0.0.1") {
          throw "main must stay fixed at 0.0.1. Actual: $version"
        }

    - name: Resolve unreleased release-notes issue
      id: release_notes
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        . ./scripts/release-support.ps1

        $repo = "${{ github.repository }}"
        $unreleasedTitle = "Release Notes: Unreleased"
        $unreleasedIssue = Get-GitHubIssueByExactTitle -Repository $repo -Title $unreleasedTitle -AllowMissing

        echo "UNRELEASED_TITLE=$unreleasedTitle" >> $env:GITHUB_OUTPUT
        echo "UNRELEASED_EXISTS=$(([string]($null -ne $unreleasedIssue)).ToLowerInvariant())" >> $env:GITHUB_OUTPUT

        if ($unreleasedIssue) {
          echo "UNRELEASED_URL=$($unreleasedIssue.Url)" >> $env:GITHUB_OUTPUT
          Write-Host "Found unreleased release-notes issue: $($unreleasedIssue.Url)"
        } else {
          Write-Warning "Release Notes: Unreleased was not found."
        }

    - name: Inspect existing release branch
      id: branch_state
      shell: pwsh
      run: |
        function Get-RemoteBranchExists([string]$BranchName) {
          git ls-remote --exit-code --heads origin $BranchName *> $null
          $exitCode = $LASTEXITCODE
          if ($exitCode -eq 0) {
            $global:LASTEXITCODE = 0
            return $true
          }
          if ($exitCode -eq 2) {
            $global:LASTEXITCODE = 0
            return $false
          }
          throw "Failed to inspect origin/$BranchName (git ls-remote exit code $exitCode)."
        }

        $releaseBranch = "${{ steps.target.outputs.RELEASE_BRANCH }}"

        $releaseExists = Get-RemoteBranchExists $releaseBranch
        if ($releaseExists) {
          git fetch --no-tags origin "$releaseBranch"
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to fetch origin/$releaseBranch."
          }

          ./scripts/assert-version-policy.ps1 -GitRef "origin/$releaseBranch" -BranchName $releaseBranch
          if ($LASTEXITCODE -ne 0) {
            throw "Version validation failed on origin/$releaseBranch."
          }
        }

        $branchMode = if ($releaseExists) { "reuse_existing" } else { "create_new" }

        echo "BRANCH_MODE=$branchMode" >> $env:GITHUB_OUTPUT
        echo "RELEASE_EXISTS=$($releaseExists.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
        Write-Host "Branch mode: $branchMode"
        Write-Host "Release branch exists: $releaseExists"

    - name: Ensure release-line notes issue
      id: line_issue
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        . ./scripts/release-support.ps1

        $repo = "${{ github.repository }}"
        $releaseSeries = "${{ steps.version.outputs.RELEASE_SERIES }}"
        $lineTitle = "Release Notes: $releaseSeries"
        $autoCreateLineIssue = "${{ inputs.auto_create_release_line_issue }}".Trim().ToLowerInvariant() -eq "true"
        $lineIssue = $null
        $lineAction = "skipped"

        if (-not $autoCreateLineIssue) {
          echo "LINE_TITLE=$lineTitle" >> $env:GITHUB_OUTPUT
          echo "LINE_URL=" >> $env:GITHUB_OUTPUT
          echo "LINE_ACTION=$lineAction" >> $env:GITHUB_OUTPUT
          exit 0
        }

        $lineIssue = Get-GitHubIssueByExactTitle -Repository $repo -Title $lineTitle -AllowMissing
        $lineAction = "reused"

        if ($null -eq $lineIssue) {
          $bodyPath = Join-Path $env:RUNNER_TEMP "release-notes-$releaseSeries.md"
          $body = @(
            "## Release Notes",
            "",
            "Current target: $releaseSeries",
            "",
            "### Added",
            "- None yet.",
            "",
            "### Changed",
            "- None yet.",
            "",
            "### Fixed",
            "- None yet."
          ) -join "`r`n"

          Set-Content -Path $bodyPath -Value $body -Encoding utf8
          $createdUrl = gh issue create --repo $repo --title $lineTitle --body-file $bodyPath 2>$null
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($createdUrl)) {
            throw "Failed to create release-line issue '$lineTitle'."
          }

          $lineIssue = [PSCustomObject]@{ Url = $createdUrl.Trim() }
          $lineAction = "created"
        } elseif (([string]$lineIssue.State).Trim().ToLowerInvariant() -ne "open") {
          gh issue reopen $lineIssue.Number --repo $repo *> $null
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to reopen release-line issue '$lineTitle' (#$($lineIssue.Number))."
          }

          $lineIssue = Get-GitHubIssueByExactTitle -Repository $repo -Title $lineTitle
          $lineAction = "reopened"
        }

        echo "LINE_TITLE=$lineTitle" >> $env:GITHUB_OUTPUT
        echo "LINE_URL=$($lineIssue.Url)" >> $env:GITHUB_OUTPUT
        echo "LINE_ACTION=$lineAction" >> $env:GITHUB_OUTPUT

    - name: Create release branch
      if: ${{ steps.branch_state.outputs.BRANCH_MODE == 'create_new' }}
      shell: pwsh
      run: |
        & ./scripts/create-release-branch.ps1 `
          -Version "${{ steps.version.outputs.RELEASE_SERIES }}" `
          -MainBranch "main" `
          -Push

    - name: Ensure RC Build
      id: rc_build
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        $releaseBranch = "${{ steps.target.outputs.RELEASE_BRANCH }}"
        if ("${{ steps.branch_state.outputs.BRANCH_MODE }}" -eq "create_new") {
          echo "RC_BUILD_ACTION=push_triggered" >> $env:GITHUB_OUTPUT
          echo "RC_BUILD_URL=" >> $env:GITHUB_OUTPUT
          Write-Host "RC Build will start from the release-branch push."
          exit 0
        }

        $repo = "${{ github.repository }}"
        $releaseHeadRef = git ls-remote --heads origin $releaseBranch
        if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($releaseHeadRef)) {
          throw "Failed to resolve origin/$releaseBranch."
        }

        $releaseHeadSha = ($releaseHeadRef -split "\s+")[0].Trim()
        $existingRunJson = gh run list `
          --repo $repo `
          --workflow rc-build.yml `
          --branch $releaseBranch `
          --limit 20 `
          --json headSha,url,status,conclusion 2>$null
        if ($LASTEXITCODE -ne 0) {
          throw "Failed to query existing RC Build runs for '$releaseBranch'."
        }

        $existingRuns = @($existingRunJson | ConvertFrom-Json)
        $existingRun = $existingRuns |
          Where-Object {
            $_.headSha -eq $releaseHeadSha -and (
              ([string]$_.status).Trim().ToLowerInvariant() -ne "completed" -or
              ([string]$_.conclusion).Trim().ToLowerInvariant() -eq "success"
            )
          } |
          Select-Object -First 1
        if ($existingRun) {
          echo "RC_BUILD_ACTION=already_present" >> $env:GITHUB_OUTPUT
          echo "RC_BUILD_URL=$($existingRun.url)" >> $env:GITHUB_OUTPUT
          exit 0
        }

        gh workflow run rc-build.yml --repo $repo --ref $releaseBranch *> $null
        if ($LASTEXITCODE -ne 0) {
          throw "Failed to dispatch RC Build for '$releaseBranch'."
        }

        echo "RC_BUILD_ACTION=dispatched" >> $env:GITHUB_OUTPUT

    - name: Summary
      shell: pwsh
      run: |
        $releaseVersion = "${{ steps.version.outputs.RELEASE_VERSION }}"
        $releaseBranch = "${{ steps.target.outputs.RELEASE_BRANCH }}"
        $branchMode = "${{ steps.branch_state.outputs.BRANCH_MODE }}"
        $lineIssue = "${{ steps.line_issue.outputs.LINE_URL }}".Trim()
        $lineIssueAction = "${{ steps.line_issue.outputs.LINE_ACTION }}".Trim()
        $rcBuildAction = "${{ steps.rc_build.outputs.RC_BUILD_ACTION }}".Trim()
        $rcBuildUrl = "${{ steps.rc_build.outputs.RC_BUILD_URL }}".Trim()
        $unreleasedIssue = "${{ steps.release_notes.outputs.UNRELEASED_URL }}".Trim()

        if (-not $unreleasedIssue) {
          $unreleasedIssue = "create manually (`${{ steps.release_notes.outputs.UNRELEASED_TITLE }}`)"
        }
        if (-not $lineIssue) {
          $lineIssue = "create manually (`${{ steps.line_issue.outputs.LINE_TITLE }}`)"
        }
        if (-not $lineIssueAction) {
          $lineIssueAction = "reused"
        }
        if (-not $rcBuildAction) {
          $rcBuildAction = "not_needed"
        }
        if (-not $rcBuildUrl) {
          $rcBuildUrl = "n/a"
        }

        @"
        ## Release Preparation Complete

        | Item | Value |
        |------|-------|
        | Release Version | $releaseVersion |
        | Release Branch | $releaseBranch |
        | Branch Prep Mode | `$branchMode` |
        | RC Build | `$rcBuildAction` |
        | RC Build Run | $rcBuildUrl |
        | Unreleased Notes | $unreleasedIssue |
        | Release Line Notes | $lineIssue |
        | Release Line Notes Action | `$lineIssueAction` |

        Next steps:
        1. Manually move the shipped bullets from `${{ steps.release_notes.outputs.UNRELEASED_TITLE }}` into `${{ steps.line_issue.outputs.LINE_TITLE }}`.
        2. Review `${{ steps.line_issue.outputs.LINE_TITLE }}` before RC / finalize.
        3. Keep `main` at `0.0.1`; version bump PR is not used.
        "@ >> $env:GITHUB_STEP_SUMMARY
